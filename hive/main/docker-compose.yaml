services:
  load-hive-{{ .HiveID }}-main:
    container_name: load-hive-{{ .HiveID }}-main
    image: hub.deepin.com/library/locustio/locust:latest
    working_dir: /mnt/locust
    command: -f /mnt/locust/locustfile.py --master -u {{ .UserCount }} -r {{ .SpawnRate }} -P {{ .WebPort }} --host {{ .Target }}
    volumes:
      - './:/mnt/locust/:ro'
    ports:
      - '{{ .WebPort }}:{{ .WebPort }}'
      - "{{ .InternalAPIPort }}:5557"
    restart: always
